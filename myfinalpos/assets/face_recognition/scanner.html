<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #111827;
      font-family: system-ui, sans-serif;
      color: #fff;
    }
    #wrap {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #111827;
    }
    #preview {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }
    #video {
      position: absolute;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
    }
    #overlay {
      display: none;
    }
    #oval {
      width: 44%;
      height: 78%;
      border: 3px solid rgba(255,255,255,0.85);
      border-radius: 50%;
      box-shadow: 0 0 0 9999px rgba(15,23,42,0.35);
    }
    #scanLine {
      position: absolute;
      left: 22%;
      right: 22%;
      height: 2px;
      background: #22c55e;
      box-shadow: 0 0 12px #22c55e;
      animation: scan 1.6s ease-in-out infinite;
      display: none;
      z-index: 3;
    }
    @keyframes scan {
      0%, 100% { top: 18%; opacity: 0.35; }
      50% { top: 78%; opacity: 1; }
    }
    .scanning #scanLine { display: block; }
  </style>
</head>
<body>
  <div id="wrap">
    <canvas id="preview"></canvas>
    <video id="video" autoplay muted playsinline></video>
    <div id="overlay">
      <div id="oval"></div>
      <div id="scanLine"></div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.14/dist/face-api.js"></script>
  <script>
    const MODEL_URL = 'https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.14/model';
    const MIN_DETECTION_SCORE = 0.38;
    const video = document.getElementById('video');
    const preview = document.getElementById('preview');
    const wrap = document.getElementById('wrap');
    let ready = false;
    let scanning = false;
    let frameHandle = 0;
    let layoutHint = { landscape: true };
    let modelsReady = false;
    let cameraStarted = false;
    let cameraFailed = false;
    let nativeCameraMode = false;

    window.setNativeCameraMode = function (enabled) {
      nativeCameraMode = !!enabled;
    };

    function post(payload) {
      const channel = window.FaceCapture;
      if (channel && channel.postMessage) {
        channel.postMessage(JSON.stringify(payload));
        return;
      }
      if (window.parent && window.parent !== window) {
        window.parent.postMessage(
          Object.assign({ source: 'greentok-face-scanner' }, payload),
          '*',
        );
      }
    }

    window.addEventListener('message', (event) => {
      const data = event.data;
      if (!data || data.source !== 'greentok-face-host') return;
      if (data.type === 'setScannerLayout') {
        window.setScannerLayout(data.width, data.height, data.landscape);
      }
      if (data.type === 'startFaceCapture') {
        window.startFaceCapture();
      }
      if (data.type === 'startCamera') {
        window.startCamera();
      }
    });

    window.setScannerLayout = function (width, height, landscape, rotation) {
      layoutHint = {
        width: Number(width) || window.innerWidth,
        height: Number(height) || window.innerHeight,
        landscape: landscape !== false,
        rotation: rotation == null || rotation === '' ? null : Number(rotation),
      };
    };

    window.setScannerRotation = function (rotation) {
      layoutHint.rotation = Number(rotation) || 0;
    };

    function containerLandscape() {
      if (layoutHint.landscape != null) return !!layoutHint.landscape;
      const w = wrap.clientWidth || window.innerWidth;
      const h = wrap.clientHeight || window.innerHeight;
      return w >= h;
    }

    function frameLandscape() {
      return video.videoWidth > video.videoHeight;
    }

    function isAndroidWebView() {
      const ua = navigator.userAgent || '';
      return /Android/i.test(ua) && (/; wv\)/i.test(ua) || /Version\/[\d.]+/i.test(ua));
    }

    function pickLandscapeRotation() {
      // Portrait camera buffer in a landscape scanner — rotate to fill wide preview.
      if (isAndroidWebView()) return -90;
      return 90;
    }

    function rotationDegrees() {
      if (!video.videoWidth || !video.videoHeight) return 0;
      if (layoutHint.rotation != null && !Number.isNaN(layoutHint.rotation)) {
        return layoutHint.rotation;
      }

      const containerLand = containerLandscape();
      const frameLand = frameLandscape();
      if (containerLand && !frameLand) return pickLandscapeRotation();
      if (!containerLand && frameLand) return -pickLandscapeRotation();
      return 0;
    }

    function applyVideoRotationHint() {
      if (!video.videoWidth || !video.videoHeight) return;
      if (containerLandscape() && !frameLandscape()) {
        layoutHint.rotation = pickLandscapeRotation();
      }
      post({
        type: 'video_meta',
        width: video.videoWidth,
        height: video.videoHeight,
        rotation: rotationDegrees(),
      });
    }

    function drawVideoFrame(ctx, destW, destH, mirror) {
      const vw = video.videoWidth;
      const vh = video.videoHeight;
      if (!vw || !vh) return;

      const rotation = rotationDegrees();
      const rotated = Math.abs(rotation) === 90;
      const srcW = rotated ? vh : vw;
      const srcH = rotated ? vw : vh;
      const scale = Math.max(destW / srcW, destH / srcH);
      const drawW = vw * scale;
      const drawH = vh * scale;

      ctx.save();
      ctx.translate(destW / 2, destH / 2);
      if (rotation !== 0) {
        ctx.rotate((rotation * Math.PI) / 180);
      }
      if (mirror) {
        ctx.scale(-1, 1);
      }
      ctx.drawImage(video, -drawW / 2, -drawH / 2, drawW, drawH);
      ctx.restore();
    }

    function paintPreview() {
      const w = wrap.clientWidth;
      const h = wrap.clientHeight;
      if (!w || !h || !video.videoWidth) {
        frameHandle = requestAnimationFrame(paintPreview);
        return;
      }

      if (preview.width !== w || preview.height !== h) {
        preview.width = w;
        preview.height = h;
      }

      const ctx = preview.getContext('2d');
      if (!ctx) return;
      ctx.clearRect(0, 0, w, h);
      drawVideoFrame(ctx, w, h, true);
      frameHandle = requestAnimationFrame(paintPreview);
    }

    function captureFrameCanvas() {
      const vw = video.videoWidth;
      const vh = video.videoHeight;
      if (!vw || !vh) return null;

      const canvas = document.createElement('canvas');
      const rotation = rotationDegrees();
      const rotated = Math.abs(rotation) === 90;
      canvas.width = rotated ? vh : vw;
      canvas.height = rotated ? vw : vh;
      const ctx = canvas.getContext('2d');
      if (!ctx) return null;
      drawVideoFrame(ctx, canvas.width, canvas.height, true);
      return canvas;
    }

    function l2Normalize(descriptor) {
      let sum = 0;
      for (let i = 0; i < descriptor.length; i += 1) {
        sum += descriptor[i] * descriptor[i];
      }
      const norm = Math.sqrt(sum);
      if (norm < 1e-10) return descriptor;
      return descriptor.map((value) => value / norm);
    }

    function faceArea(detection) {
      const box = detection.detection.box;
      return box.width * box.height;
    }

    function pickBest(candidates) {
      const viable = candidates.filter((item) => item.detection.score >= MIN_DETECTION_SCORE);
      if (viable.length === 0) return null;
      return viable.reduce((best, current) =>
        current.detection.score > best.detection.score ? current : best,
      );
    }

    function loadImageFromDataUrl(dataUrl) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => resolve(img);
        img.onerror = reject;
        img.src = dataUrl;
      });
    }

    async function detectOnInputs(inputs) {
      for (const input of inputs) {
        const ssdAll = await faceapi
          .detectAllFaces(input, new faceapi.SsdMobilenetv1Options({ minConfidence: 0.4, maxResults: 5 }))
          .withFaceLandmarks()
          .withFaceDescriptors();

        if (ssdAll.length > 0) {
          const best = pickBest(ssdAll);
          if (best && best.descriptor) return best.descriptor;
        }
      }

      const configs = [
        { inputSize: 608, scoreThreshold: 0.2 },
        { inputSize: 512, scoreThreshold: 0.24 },
        { inputSize: 416, scoreThreshold: 0.3 },
      ];

      for (const input of inputs) {
        for (const config of configs) {
          const options = new faceapi.TinyFaceDetectorOptions(config);
          const all = await faceapi
            .detectAllFaces(input, options)
            .withFaceLandmarks()
            .withFaceDescriptors();

          if (all.length > 0) {
            const best = all.reduce((a, b) => (faceArea(a) > faceArea(b) ? a : b));
            if (best.descriptor && best.detection.score >= MIN_DETECTION_SCORE) {
              return best.descriptor;
            }
          }
        }
      }

      return null;
    }

    async function detectOnce() {
      const canvas = captureFrameCanvas();
      const inputs = canvas ? [canvas, video] : [video];
      return detectOnInputs(inputs);
    }

    window.detectFromBase64Json = async function (dataUrl) {
      if (!modelsReady || scanning) return;
      scanning = true;
      wrap.classList.add('scanning');
      post({ type: 'scanning' });

      try {
        const img = await loadImageFromDataUrl(dataUrl);
        const canvas = document.createElement('canvas');
        canvas.width = img.naturalWidth || img.width;
        canvas.height = img.naturalHeight || img.height;
        const ctx = canvas.getContext('2d');
        if (!ctx) throw new Error('Could not read camera frame.');
        ctx.drawImage(img, 0, 0);

        let descriptor = null;
        for (let attempt = 0; attempt < 8; attempt += 1) {
          if (attempt > 0) {
            await new Promise((resolve) => setTimeout(resolve, 320));
          } else {
            await new Promise((resolve) => setTimeout(resolve, 200));
          }
          descriptor = await detectOnInputs([canvas]);
          if (descriptor) break;
        }

        if (!descriptor) {
          throw new Error('No face detected. Center your face and try again.');
        }

        post({
          type: 'descriptor',
          data: l2Normalize(Array.from(descriptor)),
        });
      } catch (error) {
        post({
          type: 'error',
          message: error && error.message ? error.message : 'Face scan failed',
        });
      } finally {
        scanning = false;
        wrap.classList.remove('scanning');
      }
    };

    async function openCameraStream() {
      if (cameraFailed) {
        throw new Error(
          'Camera unavailable. On the emulator: Extended controls → Camera → Front → Webcam0, then tap Enable camera again.',
        );
      }
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        throw new Error('Camera is not available in this WebView.');
      }

      const constraintSets = [
        { video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } }, audio: false },
        { video: { facingMode: 'user' }, audio: false },
      ];

      let lastError = null;
      for (const constraints of constraintSets) {
        try {
          return await navigator.mediaDevices.getUserMedia(constraints);
        } catch (error) {
          lastError = error;
        }
      }

      cameraFailed = true;
      const message = lastError && lastError.message ? lastError.message : 'No camera found';
      throw new Error(
        'Camera unavailable. On the emulator set Extended controls → Camera → Front to Webcam0, then restart the app.',
      );
    }

    async function startCameraPreview() {
      if (cameraStarted && video.srcObject) return;
      post({ type: 'status', message: 'Opening camera…' });
      const stream = await openCameraStream();
      video.srcObject = stream;
      video.addEventListener('loadedmetadata', () => {
        applyVideoRotationHint();
        cancelAnimationFrame(frameHandle);
        paintPreview();
      }, { once: true });
      window.addEventListener('resize', () => {
        cancelAnimationFrame(frameHandle);
        paintPreview();
      });
      await video.play();
      paintPreview();
      post({ type: 'camera' });
    }

    async function loadFaceModels() {
      post({ type: 'status', message: 'Loading face models…' });
      await Promise.all([
        faceapi.nets.ssdMobilenetv1.loadFromUri(MODEL_URL),
        faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL),
        faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL),
        faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL),
      ]);
    }

    async function startCamera() {
      if (cameraStarted || !modelsReady) return;
      cameraStarted = true;
      if (nativeCameraMode) {
        ready = true;
        post({ type: 'camera' });
        post({ type: 'ready' });
        return;
      }
      try {
        await startCameraPreview();
        ready = true;
        post({ type: 'ready' });
      } catch (error) {
        cameraStarted = false;
        post({
          type: 'error',
          message: error && error.message ? error.message : 'Camera unavailable',
        });
      }
    }

    async function bootstrap() {
      try {
        await loadFaceModels();
        modelsReady = true;
        post({ type: 'models_ready' });
      } catch (error) {
        post({
          type: 'error',
          message: error && error.message ? error.message : 'Could not load face models',
        });
      }
    }

    async function capture() {
      if (!ready || scanning) return;
      scanning = true;
      wrap.classList.add('scanning');
      post({ type: 'scanning' });

      try {
        let descriptor = null;
        for (let attempt = 0; attempt < 8; attempt += 1) {
          if (attempt > 0) {
            await new Promise((resolve) => setTimeout(resolve, 320));
          } else {
            await new Promise((resolve) => setTimeout(resolve, 500));
          }
          descriptor = await detectOnce();
          if (descriptor) break;
        }

        if (!descriptor) {
          throw new Error('No face detected. Center your face and try again.');
        }

        post({
          type: 'descriptor',
          data: l2Normalize(Array.from(descriptor)),
        });
      } catch (error) {
        post({
          type: 'error',
          message: error && error.message ? error.message : 'Face scan failed',
        });
      } finally {
        scanning = false;
        wrap.classList.remove('scanning');
      }
    }

    window.startFaceCapture = capture;
    window.startCamera = startCamera;
    bootstrap();
  </script>
</body>
</html>
