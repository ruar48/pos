name: myfinalpos

description: "Muñoz Macam Agri — Agriculture POS"

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
     
  cupertino_icons: ^1.0.8
  http: ^1.2.0
  provider: ^6.0.7
  excel: ^2.0.2
  path_provider: ^2.0.17
  printing: ^5.14.2
  pdf: ^3.11.3
  shared_preferences: ^2.5.3
  connectivity_plus: ^6.1.4
  awesome_dialog: ^3.0.2
  quickalert: ^1.1.0
  image_picker: ^1.1.2
  geolocator: ^13.0.2
  webview_flutter: ^4.13.0
  webview_flutter_android: ^4.13.0
  permission_handler: ^12.0.1
  camera: ^0.11.1
  pointer_interceptor: ^0.10.1+2
  print_bluetooth_thermal: ^1.1.6
  usb_serial: ^0.5.2
  nfc_manager: ^4.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
    

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/greentok_login.png
    - assets/images/munoz-macam-logo.png
    - assets/face_recognition/scanner.html

